name: Build Installers
on:
  push:
    branches: [ main ]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'
      - name: Remove conflicting jars
        run: |
          Remove-Item "out/artifacts/PsychLog_jar/javafx.web.jar" -ErrorAction SilentlyContinue
          Remove-Item "out/artifacts/PsychLog_jar/javafx-swt.jar" -ErrorAction SilentlyContinue
      - name: Build EXE
        run: |
          jpackage --input out/artifacts/PsychLog_jar `
            --name PsychLog `
            --main-jar PsychLog.jar `
            --main-class com.psychlog.MainApp `
            --type exe `
            --icon icon.ico `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "*.exe"

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: 'jdk+fx'
      - name: Remove conflicting jars
        run: |
          rm -f out/artifacts/PsychLog_jar/javafx.web.jar
          rm -f out/artifacts/PsychLog_jar/javafx-swt.jar
      - name: Build DMG
        run: |
          jpackage --input out/artifacts/PsychLog_jar \
            --name PsychLog \
            --main-jar PsychLog.jar \
            --main-class com.psychlog.MainApp \
            --type dmg \
            --icon icon.icns
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: "*.dmg"